name: Deploy landing site to GitHub Pages

# Builds landing/ and publishes it to GitHub Pages on every push to main
# that touches the site. One-time setup: Settings -> Pages -> Source:
# "GitHub Actions". Live at https://dharaneechinnu.github.io/floating-todo-tracker/
on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
        working-directory: landing

      # vite.config.js uses base "./" and writes to ../docs, so the same
      # build works under the /floating-todo-tracker/ Pages sub-path.
      - run: npm run build
        working-directory: landing

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
