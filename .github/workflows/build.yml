name: Build installers

on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A plain push to `release` has no version number attached to it, so it
  # never had a proper GitHub Release before — just a rolling "continuous"
  # pre-release. This job gives every such push a real one automatically:
  # it bumps package.json's patch version, commits, and pushes a `v*` tag,
  # which is what the `build` job below actually publishes under.
  #
  # Guarded against re-triggering itself: the commit it creates carries
  # "[skip ci]", and the `if` below also skips a push whose head commit is
  # already one of its own bump commits (belt-and-braces against the same
  # loop, in case a future workflow change drops the skip-ci reliance).
  version:
    if: >
      github.ref == 'refs/heads/release' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and tag
        id: bump
        run: |
          npm version patch -m "chore(release): v%s [skip ci]"
          echo "tag_name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push version bump and tag
        run: git push origin HEAD:release --follow-tags

  build:
    needs: version
    # Runs after `version` on a release-branch push (using the tag it just
    # created), or directly when someone pushes a `v*` tag themselves —
    # e.g. `npm version minor && git push --follow-tags` for a release
    # that isn't just the next patch.
    if: |
      always() &&
      (needs.version.result == 'success' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # electron-builder detects CI and probes the GitHub Releases API
          # (to check for an existing draft release) even though we handle
          # publishing ourselves via softprops/action-gh-release below —
          # without a token that probe hard-fails the whole build.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: floating-todo-tracker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ needs.version.outputs.tag_name }}" ]]; then
            echo "name=${{ needs.version.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: false
          target_commitish: ${{ steps.tag.outputs.name }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
