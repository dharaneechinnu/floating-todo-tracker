name: Build installers

on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # macOS signing/notarization — optional. Unset, electron-builder
          # produces an unsigned build (fine for local testing, blocked by
          # Gatekeeper for real distribution) and scripts/notarize.js skips
          # itself. Set these repo secrets to sign + notarize for real:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: floating-todo-tracker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      # A `v*` tag publishes (or updates) that exact version as a real
      # GitHub Release. A push to `release` publishes/updates a single
      # rolling "continuous" pre-release instead, so every merge to that
      # branch always has fresh, downloadable builds without needing a
      # version bump for every iteration.
      - name: Set release parameters
        id: release_params
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=continuous" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build (release branch)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_params.outputs.tag_name }}
          name: ${{ steps.release_params.outputs.name }}
          prerelease: ${{ steps.release_params.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
